[package]
name = "discord-quest-assistant"
description = "Runs a stand-in for a game so Discord counts it as played for a quest."
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Luci (LuciCMD)"]
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = "0.36"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3.4"
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
# Denied everywhere; the one Win32 call in `hardening.rs` is allowed where it stands.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
dbg_macro = "warn"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
